services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: shopflow_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://shopflow_kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
    networks:
      - shopflow-network
  redis:
    image: redis:7-alpine
    container_name: shopflow_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - shopflow-network
  prometheus:
    image: prom/prometheus:latest
    profiles: [ "monitor" ]
    container_name: shopflow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shopflow-network

  grafana:
    image: grafana/grafana:latest
    profiles: [ "monitor" ]
    container_name: shopflow_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - shopflow-network

  zipkin:
    image: openzipkin/zipkin:latest
    profiles: [ "monitor" ]
    container_name: shopflow_zipkin
    ports:
      - "9411:9411"
    networks:
      - shopflow-network

  shopflow-order:
    build:
      context: .
      args:
        SERVICE_NAME: shopflow-order
    container_name: shopflow-order
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=shopflow_kafka:9092
      - SPRING_DATA_REDIS_HOST=shopflow_redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://shopflow_zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-Xmx300m -Xms300m
    depends_on:
      - kafka
      - redis
    networks:
      - shopflow-network
  shopflow-identity:
    build:
      context: .
      args:
        SERVICE_NAME: shopflow-identity
    container_name: shopflow-identity
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=shopflow_kafka:9092
      - SPRING_DATA_REDIS_HOST=shopflow_redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://shopflow_zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-Xmx300m -Xms300m
    depends_on:
      - kafka
      - redis
    networks:
      - shopflow-network
  shopflow-inventory:
    build:
      context: .
      args:
        SERVICE_NAME: shopflow-inventory
    container_name: shopflow-inventory
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=shopflow_kafka:9092
      - SPRING_DATA_REDIS_HOST=shopflow_redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://shopflow_zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-Xmx300m -Xms300m
    depends_on:
      - kafka
      - redis
    networks:
      - shopflow-network
  shopflow-payment:
    build:
      context: .
      args:
        SERVICE_NAME: shopflow-payment
    container_name: shopflow-payment
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=shopflow_kafka:9092
      - SPRING_DATA_REDIS_HOST=shopflow_redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://shopflow_zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-Xmx300m -Xms300m
    depends_on:
      - kafka
      - redis
    networks:
      - shopflow-network
  shopflow-gateway:
    build:
      context: .
      args:
        SERVICE_NAME: shopflow-gateway
    container_name: shopflow-gateway
    ports:
      - "8080:8888"
    env_file:
      - .env
    environment:
      - IDENTITY_SERVICE_URL=http://shopflow-identity:8082
      - ORDER_SERVICE_URL=http://shopflow-order:8081
      - INVENTORY_SERVICE_URL=http://shopflow-inventory:8083
      - PAYMENT_SERVICE_URL=http://shopflow-payment:8084
      - SPRING_DATA_REDIS_HOST=shopflow_redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://shopflow_zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-Xmx300m -Xms300m
    depends_on:
      - redis
    networks:
      - shopflow-network
  shopflow-notification:
    build:
      context: .
      args:
        SERVICE_NAME: shopflow-notification
    container_name: shopflow-notification
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=shopflow_kafka:9092
      - SPRING_DATA_REDIS_HOST=shopflow_redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://shopflow_zipkin:9411/api/v2/spans
      - JAVA_TOOL_OPTIONS=-Xmx200m -Xms200m
    depends_on:
      - kafka
      - redis
    networks:
      - shopflow-network

networks:
  shopflow-network:
    driver: bridge