networks:
  shopflow-network:
    external: true
services:
  prometheus:
    image: prom/prometheus:latest
    profiles: [ "monitor" ]
    container_name: shopflow_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shopflow-network

  grafana:
    image: grafana/grafana:latest
    profiles: [ "monitor" ]
    container_name: shopflow_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - shopflow-network

  zipkin:
    image: openzipkin/zipkin:latest
    profiles: [ "monitor" ]
    container_name: shopflow_zipkin
    ports:
      - "9411:9411"
    networks:
      - shopflow-network
